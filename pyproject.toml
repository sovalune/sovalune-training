[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sovalune-training"
version = "0.1.0"
description = "Python training pipeline for Sovalune AI model fine-tuning"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "transformers>=4.35",
    "datasets>=2.14",
    "peft>=0.6",
    "accelerate>=0.24",
    "nats-py>=2.5",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
